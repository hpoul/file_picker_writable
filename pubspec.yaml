name: file_picker_writable
description: |
  Flutter plugin to allow users to open files/documents which can be read, and written back at a
  later time as well as creating new files on external media.
version: 2.2.0
homepage: https://github.com/hpoul/file_picker_writable

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ">=1.0.0 <2.0.0"
  meta: ^1.12.0
  # The fd shim's build hook (hook/build.dart). Wide ranges so an app's other
  # native-asset packages decide the versions: a caret range here forced an
  # app back to hooks 1 / code_assets 1.0. Tested at both ends and at
  # hooks 2.0.2 / code_assets 1.2.1 / native_toolchain_c 0.19.3.
  code_assets: '>=1.0.0 <3.0.0'
  hooks: '>=1.0.0 <3.0.0'
  native_toolchain_c: '>=0.17.4 <0.20.0'
  convert: ^3.0.0
  synchronized: ^3.0.0
  path_provider: ">=2.0.0 <3.0.0"
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  plugin:
    platforms:
      android:
        package: codeux.design.filepicker.file_picker_writable
        pluginClass: FilePickerWritablePlugin
      ios:
        pluginClass: FilePickerWritablePlugin
      macos:
        pluginClass: FilePickerWritablePlugin

